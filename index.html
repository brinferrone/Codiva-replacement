<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Music Playlist</title>
  <link rel="stylesheet" href__="style.css" />
  <link rel="preconnect" href__="https://fonts.googleapis.com" />
  <link rel="preconnect" href__="https://fonts.gstatic.com" crossorigin />
  <link href__="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="hero-mark">
        <span class="dot"></span>
        <span class="hero-label">Intro to Java · Final Project</span>
      </div>
      <h1>My Music Playlist</h1>
      <p class="subtitle">A web version of the Song project — store up to five songs, rate them, and let the playlist grade itself.</p>
    </header>

    <section class="stats" id="stats" aria-live="polite"></section>

    <section class="controls">
      <button class="btn btn-primary" id="addBtn">+ Add Song</button>
      <button class="btn btn-ghost" id="removeBtn">− Remove Song</button>
      <span class="capacity" id="capacity">0 / 5 songs</span>
    </section>

    <main class="grid" id="grid"></main>

    <p class="empty" id="empty" hidden>No songs yet. Click <strong>Add Song</strong> to start your playlist.</p>

    <footer class="foot">
      <span>Built with plain HTML, CSS &amp; JavaScript — no frameworks.</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
